services:
  - type: web
    name: cardio-ai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python scripts/build_kb.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GROQ_API_KEY
        sync: false
